version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Fijado a la versión que trae Vite (~1.2.x). Los patch encajan en su rango;
      # un minor/major se sube a mano, junto con Vite.
      - dependency-name: 'rolldown'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # Los tipos de Node tienen que coincidir con el runtime de .nvmrc (24).
      # Un major se sube a mano, junto con .nvmrc.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
